name: guardup
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  dio: ^5.11.1
  connectivity_plus: ^7.3.2
  equatable: ^3.0.0
  flutter_background_service: ^5.1.0
  go_router: ^18.1.2
  supabase_flutter: ^2.18.3
  flutter_dotenv: ^6.0.1
  firebase_messaging: ^17.0.1
  flutter_local_notifications: ^22.3.3
  cached_network_image: ^4.0.6
  lottie: ^3.8.0
  dartz: ^0.10.1
  wakelock_plus: ^1.8.2
  # sim_reader: ^1.0.4
  flutter_libphonenumber: ^2.8.4
  flutter_libphonenumber_android: ^2.1.1
  readmore: ^3.0.0
  pinput: ^7.0.0
  flutter_secure_storage: ^11.2.0
  country_picker: ^2.0.28
  responsive_sizer: ^3.3.1
  flutter_svg: ^2.3.2
  image_picker: ^1.2.4
  image_cropper: ^13.0.0
  file_picker: ^13.3.0
  get_it: ^9.3.0
  flutter_html: ^3.0.0
  flutter_dotted: ^1.0.0
  share_plus: ^13.3.1
  flutter_gen: ^5.15.0
  vector_graphics: ^1.2.5
  upgrader: ^13.7.0
  intl: ^0.20.3
  flutter_localizations:
    sdk: flutter
  firebase_core: ^5.1.0
  receive_sharing_intent: ^1.9.0
  shared_preferences: ^2.5.6
  collection: ^1.19.1
  timeago: ^3.7.1
  quick_container: ^0.0.3
  shimmer: ^4.0.0
  url_launcher: ^6.3.3
  freezed_annotation: ^3.1.0
  csc_picker_plus: ^0.0.3
  skeletonizer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  freezed: ^4.0.1
  json_serializable: ^6.14.1
  flutter_gen_runner: ^5.15.0
  flutter_launcher_icons: ^0.14.4

dependency_overrides:
  # Fixes flutter_html 3.0.0 breaking change: "Method not found: 'matches'" introduced in html >= 0.15.7
  html: 0.15.6

flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  generate: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - .env
    - assets/svg/
    - assets/png/
    - assets/images/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Thin.ttf
          weight: 100
        - asset: assets/fonts/Outfit-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Outfit-Light.ttf
          weight: 300
        - asset: assets/fonts/Outfit-Regular.ttf
          weight: 400
        - asset: assets/fonts/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Outfit-Bold.ttf
          weight: 700
        - asset: assets/fonts/Outfit-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Outfit-Black.ttf
          weight: 900
