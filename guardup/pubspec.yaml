name: guardup
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  dio: ^5.11.1
  connectivity_plus: ^7.3.2
  equatable: ^3.0.0
  flutter_background_service: ^5.1.0
  go_router: ^18.1.2
  supabase_flutter: ^2.18.3
  flutter_dotenv: ^6.0.1
  firebase_messaging: ^17.0.1
  flutter_local_notifications: ^22.3.3
  cached_network_image: ^4.0.6
  lottie: ^3.8.0
  dartz: ^0.10.1
  wakelock_plus: ^1.8.2
  sim_reader: ^1.0.4
  flutter_libphonenumber: ^2.8.4
  readmore: ^3.0.0
  pinput: ^7.0.0
  flutter_secure_storage: ^11.2.0
  country_picker: ^2.0.28
  responsive_sizer: ^3.3.1
  flutter_svg: ^2.3.2
  image_picker: ^1.2.4
  image_cropper: ^13.0.0
  file_picker: ^13.3.0
  get_it: ^9.3.0
  flutter_html: ^3.0.0
  flutter_dotted: ^1.0.0
  share_plus: ^13.3.1
  upgrader: ^13.7.0
  intl: ^0.20.3
  flutter_localizations:
    sdk: flutter
  firebase_core: ^5.1.0
  receive_sharing_intent: ^1.9.0
  shared_preferences: ^2.5.6
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

dependency_overrides:
  # Fixes flutter_html 3.0.0 breaking change: "Method not found: 'matches'" introduced in html >= 0.15.7
  html: 0.15.6

flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - .env
    - assets/icons/
    - assets/images/
    - assets/icons/profile/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
