name: iOS Build & App Store / TestFlight Deployment

on:
  push:
    branches:
      - release/ios
      - "release/ios/**"
      - appstore_deployment
  workflow_dispatch:
    inputs:
      destination:
        description: 'Upload target'
        required: true
        default: 'TestFlight / App Store Connect'
        type: choice
        options:
          - 'TestFlight / App Store Connect'

concurrency:
  group: appstore-ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────
  # Job 1: Build & Sign iOS Application Archive (.ipa)
  # ──────────────────────────────────────────────────────────
  build:
    name: Build & Sign IPA
    runs-on: macos-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: guardup

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create .env File (If Secret Exists)
        env:
          ENV_FILE: ${{ secrets.ENV_FILE || secrets.DOT_ENV }}
        run: |
          if [ -n "$ENV_FILE" ]; then
            echo "Creating .env file from repository secret..."
            printf "%s\n" "$ENV_FILE" > .env
            echo "Successfully generated .env file."
          else
            echo "No ENV_FILE or DOT_ENV secret provided. Skipping .env generation."
          fi

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Verify Flutter Installation
        run: flutter doctor -v

      - name: Install Dependencies & CocoaPods
        run: |
          flutter pub get
          cd ios
          pod install --repo-update
          cd ..

      - name: Install Apple Certificate & Provisioning Profile
        env:
          P12_BASE64: ${{ secrets.P12_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'ci_temp_signing_keychain' }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          # 1. Setup temporary runner keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # 2. Decode & import .p12 distribution certificate
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          echo -n "$P12_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          security import $CERTIFICATE_PATH \
            -P "$P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k $KEYCHAIN_PATH

          # Authorize codesign partition list to eliminate UI confirmation hangs
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" \
            $KEYCHAIN_PATH

          security list-keychain -d user -s $KEYCHAIN_PATH

          # 3. Decode & install provisioning profile (.mobileprovision)
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision
          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o $PROFILE_PATH

          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< $(security cms -D -i $PROFILE_PATH))
          cp $PROFILE_PATH ~/Library/MobileDevice/Provisioning\ Profiles/${PROFILE_UUID}.mobileprovision
          echo "Installed Profile UUID: $PROFILE_UUID"

      - name: Generate ExportOptions.plist
        env:
          BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>destination</key>
              <string>export</string>
              <key>method</key>
              <string>app-store</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>${BUNDLE_ID}</key>
                  <string>${PROVISIONING_PROFILE_NAME}</string>
              </dict>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>teamID</key>
              <string>${APPLE_TEAM_ID}</string>
              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF

      - name: Build Signed iOS Release IPA
        run: |
          flutter build ipa \
            --release \
            --flavor prod \
            -t lib/main_prod.dart \
            --export-options-plist=ios/ExportOptions.plist \
            --no-tree-shake-icons \
            --build-number=${{ github.run_number }}

      - name: Verify IPA Output
        run: ls -lah build/ios/ipa/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-ipa
          path: guardup/build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Cleanup Runner Keychain & Signing Files
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
          rm -rf $RUNNER_TEMP/*.p12 $RUNNER_TEMP/*.mobileprovision || true
          rm -f ios/ExportOptions.plist || true
          rm -f .env || true

  # ──────────────────────────────────────────────────────────
  # Job 2: Upload to App Store Connect / TestFlight
  # ──────────────────────────────────────────────────────────
  deploy:
    name: Upload to App Store Connect
    needs: [build]
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Download IPA Artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-release-ipa
          path: release-ipa

      - name: Verify Downloaded IPA
        run: ls -lah release-ipa/

      - name: Configure API Key & Upload to App Store Connect
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo -n "$API_KEY_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8

          IPA_PATH=$(find release-ipa -name "*.ipa" | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "ERROR: No IPA found in release-ipa/"
            exit 1
          fi
          echo "Uploading $IPA_PATH to App Store Connect via xcrun altool..."

          xcrun altool --upload-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID"

      - name: Cleanup API Keys
        if: always()
        run: |
          rm -rf ~/.appstoreconnect/private_keys || true