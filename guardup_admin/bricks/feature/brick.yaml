name: feature
description: Enterprise Feature Scaffolding Brick for GuardUp Admin (Model, Repository, Providers, Controller, Management Screen, Form Screen)
version: 0.1.0+2
environment:
  mason: ">=0.1.0-dev.36 <0.2.0"

vars:
  feature_name:
    type: string
    description: Feature name in snake_case or kebab-case (e.g. truck_type, material_type, unit_type)
    default: my_feature
    prompt: What is the feature name?
  entity_name:
    type: string
    description: Human readable entity name (e.g. "truck type", "material type", "unit type")
    default: record
    prompt: What is the entity display name (singular)?
  table_name:
    type: string
    description: DatabaseTables property name (e.g. truckTypes, materialTypes, unitTypes)
    default: myFeatures
    prompt: What is the DatabaseTables property name?
