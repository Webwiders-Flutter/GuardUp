<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GuardUp</title>
  <link rel="icon" type="image/png" href="/favicon.png"/>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      color: #1e293b;
    }
    .card {
      background: #ffffff;
      border-radius: 20px;
      padding: 36px 28px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      border: 1px solid #e2e8f0;
    }
    .logo {
      width: 80px;
      height: 80px;
      margin-bottom: 20px;
      border-radius: 16px;
      object-fit: contain;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #0f172a;
    }
    p {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 28px;
      line-height: 1.5;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 14px 20px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 15px;
      text-decoration: none;
      transition: all 0.2s ease;
      margin-bottom: 12px;
    }
    .btn-primary {
      background: #2563eb;
      color: #ffffff;
    }
    .btn-primary:hover {
      background: #1d4ed8;
    }
    .btn-secondary {
      background: #f1f5f9;
      color: #334155;
    }
    .btn-secondary:hover {
      background: #e2e8f0;
    }
    .spinner {
      margin: 16px auto;
      width: 24px;
      height: 24px;
      border: 3px solid #e2e8f0;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="GuardUp" class="logo" onerror="this.style.display='none'">

    <h1>GuardUp</h1>
    <p id="status-text">Redirecting you to the app...</p>
    <div class="spinner" id="spinner"></div>

    <div style="margin-top: 24px;">
      <a id="btn-open-app" href="#" class="btn btn-primary">Open App</a>
      <a id="btn-playstore" href="https://play.google.com/store/apps/details?id=com.guardup.app" class="btn btn-secondary">
        Download on Google Play
      </a>
    </div>
  </div>

  <script>
    const PACKAGE_NAME = "com.guardup.app";
    const APP_SCHEME = "guardup://open";
    const PLAY_STORE_URL = "https://play.google.com/store/apps/details?id=" + PACKAGE_NAME;
    const INTENT_URL = "intent://open#Intent;scheme=guardup;package=" + PACKAGE_NAME + ";S.browser_fallback_url=" + encodeURIComponent(PLAY_STORE_URL) + ";end;";

    const isAndroid = /Android/i.test(navigator.userAgent);
    const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

    document.getElementById("btn-open-app").href = isAndroid ? INTENT_URL : APP_SCHEME;

        function redirectToApp() {
      if (isAndroid) {
        // Direct intent launch for Chrome/Android
        window.location.href = INTENT_URL;

        // If Chrome blocks automatic intent launch without user gesture,
        // update the status and stop the spinner after 2 seconds
        setTimeout(() => {
          document.getElementById("status-text").textContent = "Tap below to open the app or download:";
          document.getElementById("spinner").style.display = "none";
        }, 2000);
      } else if (isIOS) {
        // For iOS fallback
        const start = Date.now();
        window.location.href = APP_SCHEME;
        setTimeout(() => {
          if (!document.hidden && Date.now() - start < 2000) {
            window.location.href = PLAY_STORE_URL;
          }
        }, 1500);
      } else {
        // Desktop browser - show links
        document.getElementById("status-text").textContent = "Open in your mobile device or download from the Play Store.";
        document.getElementById("spinner").style.display = "none";
      }
    }


    window.addEventListener("DOMContentLoaded", () => {
      if (isAndroid || isIOS) {
        redirectToApp();
      }
    });
  </script>
</body>
</html>
